name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ──────────────────────────────────────────────
  # Lint — runs frontend & backend in parallel
  # ──────────────────────────────────────────────
  lint:
    name: Lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint -w ${{ matrix.workspace }}

  # ──────────────────────────────────────────────
  # Type-check — runs frontend & backend in parallel
  # ──────────────────────────────────────────────
  typecheck:
    name: Type Check (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: frontend
            tsconfig: frontend/tsconfig.json
          - workspace: backend
            tsconfig: backend/tsconfig.json
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore TypeScript incremental cache
        uses: actions/cache@v4
        with:
          path: |
            backend/.tsbuildinfo
            frontend/.next/cache
          key: tsbuildinfo-${{ matrix.workspace }}-${{ hashFiles(format('{0}/src/**/*.ts', matrix.workspace), format('{0}/tsconfig.json', matrix.workspace)) }}
          restore-keys: |
            tsbuildinfo-${{ matrix.workspace }}-

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Type Check
        run: npx tsc --noEmit -p ${{ matrix.tsconfig }}

  # ──────────────────────────────────────────────
  # Build Frontend — needs lint + typecheck to pass
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx', 'frontend/**/*.css') }}
          restore-keys: |
            nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Build Frontend
        run: npm run build -w frontend

  # ──────────────────────────────────────────────
  # Build Backend — needs lint + typecheck to pass
  # ──────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Build Backend
        run: npm run build -w backend

  # ──────────────────────────────────────────────
  # Security audit — both workspaces in parallel
  # ──────────────────────────────────────────────
  security:
    name: Security Audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Audit ${{ matrix.workspace }}
        run: npm audit --audit-level=high -w ${{ matrix.workspace }}
